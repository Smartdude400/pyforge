[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyforge"
version = "0.1.0"
description = "A modular, fixed-timestep 2D game engine in Python built on pygame-ce."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PyForge" }]
keywords = ["game-engine", "2d", "pygame", "ecs", "gamedev"]
dependencies = ["pygame-ce>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.5"]

[project.urls]
Homepage = "https://example.com/pyforge"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# The public API __all__ is grouped by subsystem for readability, not isort-sorted.
"pyforge/__init__.py" = ["RUF022"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# pygame-ce ships partial stubs; silence missing-stub noise for the backend only.
[[tool.mypy.overrides]]
module = ["pygame.*"]
ignore_missing_imports = true
